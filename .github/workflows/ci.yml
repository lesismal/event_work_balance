name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gofmt / vet / staticcheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go/go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      # The engine is split per OS, so vet and staticcheck run once per target.
      - name: go vet
        run: |
          for goos in linux darwin windows freebsd; do
            echo "::group::GOOS=$goos"
            GOOS=$goos go vet ./...
            echo "::endgroup::"
          done
      - name: staticcheck
        run: |
          for goos in linux darwin windows; do
            echo "::group::GOOS=$goos"
            GOOS=$goos "$(go env GOPATH)/bin/staticcheck" ./...
            echo "::endgroup::"
          done

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22.x', stable]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.mod
      # Go 1.22's internal linker omits LC_UUID, which current macOS dyld
      # refuses to load; the external linker adds it.
      - name: Use external linker for Go 1.22 on macOS
        if: runner.os == 'macOS' && matrix.go == '1.22.x'
        run: echo "GOFLAGS=-ldflags=-linkmode=external" >> "$GITHUB_ENV"
      - name: Build
        run: go build ./...
      - name: Test
        shell: bash
        run: |
          set +e
          go test -race -count=1 -timeout 10m -v ./... > "$RUNNER_TEMP/test.log" 2>&1
          status=$?
          grep -v -E '^(=== (RUN|PAUSE|CONT)|\s*--- PASS)' "$RUNNER_TEMP/test.log"
          skipped=$(grep -E -A1 -- '--- SKIP' "$RUNNER_TEMP/test.log")
          if [ -n "$skipped" ]; then
            skipped=${skipped//$'\n'/'%0A'}
            echo "::notice title=skipped tests::$skipped"
          fi
          if [ "$status" -ne 0 ]; then
            # Surface the failures as an annotation so they are readable
            # without opening the full log.
            summary=$(grep -E -B2 -A20 -- '--- FAIL|^panic:|^FAIL|fatal error:' "$RUNNER_TEMP/test.log" | head -c 60000)
            summary=${summary//'%'/'%25'}
            summary=${summary//$'\r'/'%0D'}
            summary=${summary//$'\n'/'%0A'}
            echo "::error title=go test failed::$summary"
          fi
          exit "$status"

  cross-build:
    name: Cross build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go/go.mod
      - name: Build all targets
        working-directory: go
        run: |
          # freebsd exercises the portable fallback engine.
          for target in \
            linux/amd64 linux/arm64 linux/arm linux/riscv64 linux/loong64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64 windows/386 \
            freebsd/amd64; do
            echo "building $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build ./...
          done

  c:
    name: C (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make -C c CC=${{ matrix.cc }} CFLAGS="-O2 -g -std=c11 -Wall -Wextra -Wpedantic -Werror"
      - name: Integration test
        run: make -C c test CC=${{ matrix.cc }}

  autobahn:
    name: Autobahn WebSocket (ws://)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: go/go.mod
      - name: Build echo server
        working-directory: go
        run: go build -o "$RUNNER_TEMP/websocket_server" ./examples/websocket_server
      - name: Start echo server
        run: |
          "$RUNNER_TEMP/websocket_server" -addr 127.0.0.1:9001 -compress > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 50); do
            nc -z 127.0.0.1 9001 && exit 0
            sleep 0.2
          done
          echo "server did not start"
          cat "$RUNNER_TEMP/server.log"
          exit 1
      # TLS is not covered. run.sh splits the cases across several wstest
      # processes and checks every report.
      - name: Run fuzzingclient
        run: |
          # Record memory use, so a run that is killed shows who grew.
          (while sleep 30; do
            echo "$(date -u +%T) $(free -m | awk '/^Mem:/ {print "used=" $3 "MiB avail=" $7 "MiB"}')" \
              "server_rss=$(ps -o rss= -C websocket_server | tr -d ' ')KiB" \
              "$(docker stats --no-stream --format '{{.Name}}={{.MemUsage}}' | tr '\n' ' ')"
          done) > "$RUNNER_TEMP/memory.log" 2>&1 &
          .github/autobahn/run.sh reports
      - name: Diagnostics
        if: failure()
        run: |
          tail -n 40 "$RUNNER_TEMP/memory.log" || true
          sudo dmesg | grep -iE 'out of memory|oom|killed process' | tail -n 20 || true
          tail -n 40 "$RUNNER_TEMP/server.log" || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: autobahn-report
          path: reports
          if-no-files-found: ignore
