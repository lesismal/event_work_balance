<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Single-loop epoll architecture overview</title><desc id="desc">One event loop dispatches events into per-connection FIFO queues. Connections are dynamically assigned to idle workers without affinity, with one executor per connection.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a29"/><stop offset="1" stop-color="#070b12"/></linearGradient><linearGradient id="accent"><stop stop-color="#54e1d1"/><stop offset="1" stop-color="#65a7ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#65a7ff"/></marker><style>.title{font:700 26px Inter,system-ui,sans-serif;fill:#edf3ff}.sub{font:13px Inter,system-ui,sans-serif;fill:#8e9bb0}.k{font:700 11px ui-monospace,monospace;fill:#54e1d1;letter-spacing:1px}.h{font:700 16px Inter,system-ui,sans-serif;fill:#e8edf7}.t{font:12px Inter,system-ui,sans-serif;fill:#9eabc0}.m{font:11px ui-monospace,monospace;fill:#b9c6da}.box{fill:#0c1420;stroke:#2a3a52}.hot{stroke:#54e1d1}.pool{stroke:#ae8cff}</style></defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg)"/><text x="48" y="55" class="title">One I/O core. Ordered per connection. Balanced across workers.</text><text x="48" y="81" class="sub">The connection—not the individual event—is the scheduling and serialization unit.</text>
  <text x="48" y="125" class="k">01 / I/O OWNERSHIP</text><text x="440" y="125" class="k">02 / PER-CONNECTION ORDER</text><text x="842" y="125" class="k">03 / DYNAMIC EXECUTION</text>
  <rect x="48" y="146" width="270" height="214" rx="15" class="box hot"/><text x="70" y="180" class="h">epoll event loop</text><text x="70" y="203" class="t">one thread · all fds</text><text x="70" y="242" class="m">epoll_wait · EPOLLET</text><text x="70" y="270" class="m">accept4 until EAGAIN</text><text x="70" y="298" class="m">epoll_ctl ADD / MOD / DEL</text><text x="70" y="326" class="m">close(fd) · lifecycle owner</text>
  <path d="M318 252C360 252 372 210 408 210" fill="none" stroke="url(#accent)" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="416" y="146" width="352" height="116" rx="15" class="box hot"/><text x="438" y="178" class="h">connection · fd 42</text><text x="630" y="178" class="m">scheduled = true</text><text x="438" y="208" class="t">FIFO</text><rect x="484" y="190" width="46" height="26" rx="5" fill="#122536" stroke="#54e1d1"/><text x="499" y="208" class="m">IN</text><rect x="536" y="190" width="52" height="26" rx="5" fill="#252016" stroke="#ffbf69"/><text x="546" y="208" class="m">OUT</text><rect x="594" y="190" width="69" height="26" rx="5" fill="#291820" stroke="#ff7285"/><text x="604" y="208" class="m">RDHUP</text><text x="438" y="242" class="m">mutex · ordered queue · one executor</text>
  <rect x="416" y="278" width="352" height="82" rx="15" class="box"/><text x="438" y="310" class="h">connection · fd 81</text><text x="438" y="339" class="m">independent FIFO · parallel with fd 42</text><path d="M768 210H810" stroke="#ae8cff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="818" y="146" width="334" height="214" rx="15" class="box pool"/><text x="840" y="180" class="h">shared worker pool</text><text x="840" y="203" class="t">ready queue contains connections</text><text x="840" y="242" class="m">this round: worker #2 → fd 42</text><text x="840" y="270" class="m">next round: worker #0 → fd 42</text><text x="840" y="306" class="m">NO FIXED BINDING</text><text x="840" y="334" class="m">AT MOST 1 WORKER / CONNECTION</text>
  <path d="M1050 360C1050 428 760 430 702 386" fill="none" stroke="#ffbf69" stroke-width="1.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <rect x="48" y="410" width="1104" height="102" rx="15" fill="#09111b" stroke="#263850"/><text x="72" y="443" class="k">SCHEDULING CONTRACT</text><text x="72" y="478" class="h">① FIFO preserves order</text><text x="378" y="478" class="h">② Any idle worker may execute</text><text x="762" y="478" class="h">③ One worker drains the queue</text><text x="72" y="499" class="t">per connection</text><text x="378" y="499" class="t">no connection affinity</text><text x="762" y="499" class="t">scheduled stays true until empty</text>
</svg>
